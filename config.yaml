# BroodLink configuration: every threshold and permutation count.
# This file lists the defaults (it is generated from broodlink/config.py; a test checks that
# the two agree). Copy it, change what you need and pass it with --config; keys you leave out
# keep their defaults. The source of every default is given in docs/EXTRACTED_METHOD.md and,
# for the swept parameters, in docs/SWEEP.md. Keys marked "new in BroodLink" in
# broodlink/config.py are not rules of the original analysis.
#
# nomination.theta_max: null = second degree or closer, no upper bound (the original code and
# Methods). Set 0.177 to restrict the statistic to the second-degree band.
